name: Build, publish and deploy to MonsterASP.NET

on: [push]

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: dotnet restore HackerRank1.sln

      - name: Build
        run: dotnet build HackerRank1.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish HackerRank1/HackerRank1.csproj --configuration Release --output ./publish --runtime win-x86

      - name: Test with .NET
        run: dotnet test HackerRank1.sln --configuration Release --no-build
        continue-on-error: true

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
